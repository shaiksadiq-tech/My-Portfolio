<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
      <style>
        .highlightedBox{
    box-shadow: 0 0 15px red;
    transform: scale(1.05);
    transition: all 0.3s ease;
}

.winningbox{
    background-color: green !important;
    color: white !important;
}

@keyframes winnerPulse{
    from{
        transform: scale(1);
    }
    to{
        transform: scale(1.08);
    }
}

.box{
    width: 180px;
    height: 40px;
    background-color: rgb(243,243,88);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:12px;
    margin:5px;
    text-align:center;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    transition:all .3s ease;
    border-radius:8px;
    cursor:pointer;
}

.box:hover{
    transform:translateY(-3px);
}

button{
    background-color:rgb(47,47,202);
    padding:14px 30px;
    border:none;
    color:white;
    cursor:pointer;
    border-radius:8px;
    margin-top:20px;
    font-size:16px;
    transition:.3s ease;
}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

body{
    background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b
    );
    min-height:100vh;
}

.lotteryconatainer{
    background:white;
    width:90%;
    max-width:1200px;
    margin:20px auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.lottery-sheet-container{
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
}
.headding{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0px;
    margin-bottom: 40px;
}


    </style>
</head>

<body>

    <div class="lotteryconatainer">
        <div class="headding">
        <h1>🎰 Lucky Draw Lottery Game </h1>
        <span > <b>Built with HTML, CSS & JavaScript</b></span>
</div>
      <div class="lottery-sheet-container" id="lotterySheetContainer">
        <!--<div class="box winningbox">1. 100 cash</div>
         <div class="box">1. 100 cash</div> -->
        <!-- <div class="box">2. Toy car</div>
        <div class="box">2. Toy car</div>
        <div class="box">2. Toy car</div> -->
       
      </div>
      <h2 id="result">Result</h2>
      <button id="pickanumber">Pick a Number</button>
      <button id="clearHistory">Clear History</button>
    </div> </div>
    <script src="script.js"></script>
  <footer style="text-align: center; color: white;">

</footer>
</body>
</html>
